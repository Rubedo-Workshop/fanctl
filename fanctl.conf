# fanctl configuration — /etc/fanctl.conf

# Sensors to monitor (uses MAX temp across all sensors for safety)
# temp2=TC0F (CPU die), temp4-9=CPU cores, temp13=TCSA, temp22=TPCD (PCH)
SENSORS="temp2 temp4 temp5 temp6 temp7 temp8 temp9 temp13 temp22"

# Temperature curve: "TEMP_C:RPM ..." — must be ascending
# Edit these points to tune aggressiveness
CURVE="45:1700 55:2500 65:3200 72:3800 78:4400"

# Hardware minimum RPM
MIN_RPM=1700

# Normal maximum RPM
MAX_RPM=4400

# Turbo/overclock RPM — hardware will cap at its physical limit (~4400)
# Set higher to test if firmware allows it, or keep at 4400 for guaranteed max
OVERCLOCK_RPM=5000

# Poll interval in seconds
INTERVAL=3
